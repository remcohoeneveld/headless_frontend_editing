# Hooks are autowired classes in src/Hook.
services:
  _defaults:
    autowire: true
  Drupal\headless_frontend_editing\PreviewToken: {}
  Drupal\headless_frontend_editing\Authentication\PreviewTokenAuth:
    tags:
      # Not global: only routes whose _auth lists it (JSON:API, GraphQL).
      - { name: authentication_provider, provider_id: headless_frontend_editing_preview, priority: 100 }
