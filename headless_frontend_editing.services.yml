# Hooks are autowired classes in src/Hook.
services:
  _defaults:
    autowire: true
  Drupal\headless_frontend_editing\PreviewToken: {}
  Drupal\headless_frontend_editing\TargetResolver: {}
  Drupal\headless_frontend_editing\Revalidator:
    tags:
      - { name: needs_destruction }
  logger.channel.headless_frontend_editing:
    parent: logger.channel_base
    arguments: [headless_frontend_editing]
  Drupal\headless_frontend_editing\Authentication\PreviewTokenAuth:
    tags:
      # Not global: only routes whose _auth lists it (JSON:API, GraphQL).
      - {
          name: authentication_provider,
          provider_id: headless_frontend_editing_preview,
          priority: 100,
        }
  Drupal\headless_frontend_editing\EventSubscriber\PreviewTokenReadOnlySubscriber:
    tags:
      - { name: event_subscriber }
  Drupal\headless_frontend_editing\PageCache\DisallowPreviewTokenRequests:
    public: false
    tags:
      - { name: page_cache_request_policy }
      - { name: dynamic_page_cache_request_policy }
  Drupal\headless_frontend_editing\Routing\RouteSubscriber:
    tags:
      - { name: event_subscriber }
  Drupal\headless_frontend_editing\FieldFocus: {}
  Drupal\headless_frontend_editing\LivePreview: {}
