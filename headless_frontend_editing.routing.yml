headless_frontend_editing.settings:
  path: '/admin/config/services/headless-frontend-editing'
  defaults:
    _form: '\Drupal\headless_frontend_editing\Form\SettingsForm'
    _title: 'Headless frontend editing'
  requirements:
    _permission: 'administer headless frontend editing'

headless_frontend_editing.describe:
  path: '/headless-frontend-editing/describe'
  defaults:
    _controller: '\Drupal\headless_frontend_editing\Controller\ProtocolController::describe'
  methods: [POST]
  requirements:
    _permission: 'use headless frontend editing'
    _csrf_request_header_token: 'TRUE'
  options:
    no_cache: true

headless_frontend_editing.token:
  path: '/headless-frontend-editing/token'
  defaults:
    _controller: '\Drupal\headless_frontend_editing\Controller\ProtocolController::token'
  methods: [GET]
  requirements:
    _permission: 'use headless frontend editing'
  options:
    no_cache: true

headless_frontend_editing.edit:
  path: '/headless-frontend-editing/edit/{langcode}/{target}'
  defaults:
    _controller: '\Drupal\headless_frontend_editing\Controller\EditController::edit'
    _title: 'Edit'
  requirements:
    _permission: 'use headless frontend editing'
    _custom_access: '\Drupal\headless_frontend_editing\Controller\EditController::access'
  options:
    _admin_route: true
    no_cache: true

headless_frontend_editing.saved:
  path: '/headless-frontend-editing/saved'
  defaults:
    _controller: '\Drupal\headless_frontend_editing\Controller\EditController::saved'
    _title: 'Saved'
  requirements:
    _permission: 'use headless frontend editing'
  options:
    _admin_route: true
    no_cache: true
