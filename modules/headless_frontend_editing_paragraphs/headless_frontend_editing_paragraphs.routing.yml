headless_frontend_editing_paragraphs.add:
  path: '/headless-frontend-editing/paragraph/{uuid}/add/{position}'
  defaults:
    _controller: '\Drupal\headless_frontend_editing_paragraphs\Controller\ParagraphController::add'
    _title: 'Add a section'
  requirements:
    _permission: 'use headless frontend editing'
    _custom_access: '\Drupal\headless_frontend_editing_paragraphs\Controller\ParagraphController::access'
    uuid: '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'
    position: 'before|after'
  options:
    _admin_route: true
    no_cache: true

headless_frontend_editing_paragraphs.add_form:
  path: '/headless-frontend-editing/paragraph/{uuid}/add/{position}/{bundle}'
  defaults:
    _controller: '\Drupal\headless_frontend_editing_paragraphs\Controller\ParagraphController::addForm'
    _title_callback: '\Drupal\headless_frontend_editing_paragraphs\Controller\ParagraphController::addTitle'
  requirements:
    _permission: 'use headless frontend editing'
    _custom_access: '\Drupal\headless_frontend_editing_paragraphs\Controller\ParagraphController::access'
    uuid: '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'
    position: 'before|after'
    bundle: '[a-z0-9_]+'
  options:
    _admin_route: true
    no_cache: true

headless_frontend_editing_paragraphs.move:
  path: '/headless-frontend-editing/paragraph/{uuid}/move/{direction}'
  defaults:
    _controller: '\Drupal\headless_frontend_editing_paragraphs\Controller\ParagraphController::move'
  methods: [POST]
  requirements:
    _permission: 'use headless frontend editing'
    _custom_access: '\Drupal\headless_frontend_editing_paragraphs\Controller\ParagraphController::access'
    _csrf_request_header_token: 'TRUE'
    uuid: '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'
    direction: 'up|down'
  options:
    no_cache: true

headless_frontend_editing_paragraphs.delete:
  path: '/headless-frontend-editing/paragraph/{uuid}/delete'
  defaults:
    _form: '\Drupal\headless_frontend_editing_paragraphs\Form\ParagraphDeleteForm'
    _title: 'Delete a section'
  requirements:
    _permission: 'use headless frontend editing'
    _custom_access: '\Drupal\headless_frontend_editing_paragraphs\Controller\ParagraphController::deleteAccess'
    uuid: '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'
  options:
    _admin_route: true
    no_cache: true
